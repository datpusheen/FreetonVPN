<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="40" y1="20" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="52" fill="url(#glowGrad)" filter="url(#neonGlow)" />

  <!-- Shield Base Background -->
  <path d="M60 14 C82 14 100 24 100 48 C100 78 60 106 60 106 C60 106 20 78 20 48 C20 24 38 14 60 14 Z" 
        fill="#0b0f19" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" />

  <!-- Inner Shield Accent -->
  <path d="M60 22 C76 22 90 30 90 50 C90 73 60 96 60 96 C60 96 30 73 30 50 C30 30 44 22 60 22 Z" 
        fill="#131b2e" 
        stroke="url(#shieldGrad)" 
        stroke-width="1.2" 
        stroke-opacity="0.6" />

  <!-- WireGuard Ring Orbit -->
  <ellipse cx="60" cy="58" rx="26" ry="12" 
           stroke="#38bdf8" 
           stroke-width="1.5" 
           stroke-dasharray="4 3" 
           stroke-opacity="0.6" 
           transform="rotate(-25 60 58)" />

  <!-- Lightning Bolt (Freeton Pulse) -->
  <path d="M65 28 L42 62 L58 62 L52 92 L78 54 L62 54 Z" 
        fill="url(#boltGrad)" 
        filter="url(#neonGlow)" />

  <!-- Center Sparkle -->
  <circle cx="60" cy="58" r="2.5" fill="#ffffff" />
</svg>
