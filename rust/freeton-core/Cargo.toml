[package]
name = "freeton-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
bcrypt = "0.19"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem"] }
num-bigint = "0.5"
pgp = "0.21"
pkcs8 = { version = "0.11", features = ["pem", "std"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2", "charset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2.5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security_Credentials", "Win32_System_Registry"] }
zeroize = { version = "1.9", features = ["derive"] }
